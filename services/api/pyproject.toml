[project]
name = "ghostshift-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "pypdf>=6.21.4,<7",
]
[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.13,<2"]
[tool.ruff]
line-length = 100
[tool.mypy]
python_version = "3.12"
strict = true
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
