name: Verify GhostShift
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.25'
          enable-cache: true
      - run: make install
      - run: ./scripts/install-caddy-ci.sh "$RUNNER_TEMP/caddy-bin"
      - run: echo "$RUNNER_TEMP/caddy-bin" >> "$GITHUB_PATH"
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: make lint && make typecheck && make test
      - run: make e2e
      - run: make e2e-public
      - run: cd apps/web && npm audit --omit=dev
      - run: uvx pip-audit==2.10.1 --path services/api/.venv/lib/python3.12/site-packages
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: browser-evidence
          path: apps/web/test-results/
          retention-days: 7
